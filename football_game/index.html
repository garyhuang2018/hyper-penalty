<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>热血足球</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    #gameContainer {
      position: relative;
      border: 4px solid #333;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    }

    #gameCanvas {
      display: block;
      background-color: #1a1a2e;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #startOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
    }

    #startOverlay h1 {
      font-size: 48px;
      color: #e74c3c;
      text-shadow: 3px 3px 0 #000;
      margin-bottom: 20px;
    }

    #startOverlay .controls {
      font-size: 16px;
      line-height: 2;
      margin-bottom: 30px;
    }

    #startOverlay .controls span {
      color: #f1c40f;
    }

    #startOverlay .start-hint {
      font-size: 20px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="startOverlay">
      <h1>热血足球</h1>
      <div class="controls">
        <span>方向键/WASD</span>: 移动球员<br>
        <span>空格(按住蓄力,松开射门)</span>: 射门<br>
        <span>Q/E</span>: 切换控制球员
      </div>
      <div class="start-hint">按任意键开始比赛</div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
