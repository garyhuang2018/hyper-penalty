<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热血点球大战</title>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Sans SC', sans-serif;
            overflow: hidden;
        }
        #gameContainer { position: relative; width: 900px; height: 650px; }
        canvas { border-radius: 12px; box-shadow: 0 0 60px rgba(220, 38, 38, 0.3); }
        #ui {
            position: absolute; top: 15px; left: 15px; color: #fff; font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8); line-height: 1.6;
            background: rgba(0,0,0,0.85); padding: 12px 18px; border-radius: 8px;
            border-left: 4px solid #fbbf24;
        }
        #ui .score { font-family: 'Russo One', sans-serif; font-size: 28px; letter-spacing: 2px; }
        #ui .round { font-size: 12px; opacity: 0.8; margin-bottom: 4px; }
        #instruction {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: #fff; font-size: 18px; text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
            background: rgba(0,0,0,0.85); padding: 12px 28px; border-radius: 25px;
            font-weight: 700; letter-spacing: 1px; border: 2px solid #fbbf24;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.02); } }
        #powerBar {
            position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
            width: 280px; height: 28px; background: rgba(0,0,0,0.8); border: 3px solid #fff;
            border-radius: 14px; display: none; overflow: hidden;
        }
        #powerFill { height: 100%; width: 50%; background: linear-gradient(90deg, #22c55e, #fbbf24, #ef4444); border-radius: 11px; transition: width 0.05s linear; }
        .result-popup {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-family: 'Russo One', sans-serif; font-size: 80px;
            animation: popResult 1.5s ease-out forwards; pointer-events: none;
            text-shadow: 4px 4px 8px rgba(0,0,0,0.9);
        }
        .result-popup.goal { color: #22c55e; }
        .result-popup.save { color: #ef4444; }
        @keyframes popResult { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; } 40% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%) scale(0.8); } }
        .corner-sign { position: absolute; font-size: 12px; color: rgba(255,255,255,0.5); }
        .corner-sign.tl { top: 185px; left: 85px; }
        .corner-sign.tr { top: 185px; right: 85px; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="game" width="900" height="650"></canvas>
        <div id="ui">
            <div class="round">ROUND <span id="roundNum">1</span>/5</div>
            <div class="score"><span id="playerScore">0</span> - <span id="aiScore">0</span></div>
            <div id="modeText">CHOOSE SIDE</div>
        </div>
        <div class="corner-sign tl">← 左</div>
        <div class="corner-sign tr">右 →</div>
        <div id="instruction"></div>
        <div id="powerBar"><div id="powerFill"></div></div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const instruction = document.getElementById('instruction');
        const powerBar = document.getElementById('powerBar');
        const powerFill = document.getElementById('powerFill');
        const roundNumEl = document.getElementById('roundNum');
        const playerScoreEl = document.getElementById('playerScore');
        const aiScoreEl = document.getElementById('aiScore');
        const modeTextEl = document.getElementById('modeText');
        const gameContainer = document.getElementById('gameContainer');

        const PHASE = {
            TITLE: 'title', COIN: 'coin', KICK_SELECT: 'kick_select', KICK_POWER: 'kick_power',
            KICK_FLY: 'kick_fly', KEEP: 'keep', KEEP_FLY: 'keep_fly', RESULT: 'result', GAMEOVER: 'gameover'
        };

        const gs = {
            phase: PHASE.TITLE, playerScore: 0, aiScore: 0, round: 1, playerIsKicker: true,
            coinResult: null, selectedZone: 4, power: 50, powerDir: 1,
            ball: { x: 450, y: 520, z: 0, vx: 0, vy: 0 },
            ballTargetX: 0, ballEndX: 0,
            kicker: { x: 450, y: 520, frame: 0, kicking: false },
            keeper: { x: 450, y: 140, jumping: false, diving: false, diveX: 0, diveDir: 0 },
            animTimer: 0, resultTimer: 0, shakeIntensity: 0, kickResult: null
        };

        const zones = [
            { x: 300, y: 85 }, { x: 450, y: 65 }, { x: 600, y: 85 },
            { x: 280, y: 135 }, { x: 450, y: 120 }, { x: 620, y: 135 },
            { x: 260, y: 185 }, { x: 450, y: 170 }, { x: 640, y: 185 }
        ];

        const COLORS = { blue: '#2563eb', red: '#dc2626', skin: '#f4c58a', hair: '#2a2a2a' };

        function drawStadium() {
            const skyGrad = ctx.createLinearGradient(0, 0, 0, 180);
            skyGrad.addColorStop(0, '#1e3a5f'); skyGrad.addColorStop(1, '#3d5a80');
            ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, 900, 180);

            ctx.fillStyle = '#c9302c';
            ctx.beginPath(); ctx.moveTo(0, 180);
            for (let x = 0; x <= 900; x += 15) ctx.lineTo(x, 180 - (25 + Math.sin(x * 0.02) * 8));
            ctx.lineTo(900, 180); ctx.closePath(); ctx.fill();

            ctx.fillStyle = '#e04b4b';
            ctx.beginPath(); ctx.moveTo(0, 180);
            for (let x = 0; x <= 900; x += 15) ctx.lineTo(x, 180 - (15 + Math.sin(x * 0.02 + 1) * 5));
            ctx.lineTo(900, 180); ctx.closePath(); ctx.fill();

            ctx.fillStyle = '#1a6b1a';
            ctx.beginPath();
            ctx.moveTo(80, 170); ctx.lineTo(820, 170); ctx.lineTo(920, 660); ctx.lineTo(-20, 660);
            ctx.closePath(); ctx.fill();

            ctx.save(); ctx.clip();
            ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 2;
            for (let y = 170; y < 660; y += 20) {
                const p = (y - 170) / 490;
                ctx.beginPath();
                ctx.moveTo(80 + p * (-100), y); ctx.lineTo(820 + p * 100, y);
                ctx.stroke();
            }
            ctx.restore();

            ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(450, 550, 120, Math.PI, Math.PI * 2); ctx.stroke();

            ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(250, 170); ctx.lineTo(220, 170); ctx.lineTo(220, 260); ctx.lineTo(680, 260); ctx.lineTo(680, 170); ctx.lineTo(650, 170);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(330, 170); ctx.lineTo(310, 170); ctx.lineTo(310, 320); ctx.lineTo(590, 320); ctx.lineTo(590, 170); ctx.lineTo(570, 170);
            ctx.stroke();

            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(450, 450, 5, 0, Math.PI * 2); ctx.fill();

            ctx.strokeStyle = '#fff'; ctx.lineWidth = 10; ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(280, 170); ctx.lineTo(280, 85); ctx.lineTo(620, 85); ctx.lineTo(620, 170);
            ctx.stroke(); ctx.lineCap = 'butt';

            ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
            for (let x = 280; x <= 620; x += 25) {
                ctx.beginPath(); ctx.moveTo(x, 85); ctx.lineTo(x + (x - 450) * 0.12, 170); ctx.stroke();
            }
            for (let y = 85; y <= 170; y += 18) {
                ctx.beginPath(); ctx.moveTo(280 + (y - 85) * 0.5, y); ctx.lineTo(620 - (y - 85) * 0.5, y); ctx.stroke();
            }
        }

        function drawPlayer(x, y, color, isKicker, facingLeft, jumping, diving, diveDir, diveProgress) {
            ctx.save();
            ctx.translate(x, y);

            if (facingLeft) ctx.scale(-1, 1);

            let bodyRot = 0;
            let armExtend = 0;
            let bodyY = 0;

            if (diving && diveDir !== 0) {
                bodyRot = diveDir * 0.7 * diveProgress;
                armExtend = diveProgress;
                bodyY = -10 * diveProgress;
            } else if (jumping) {
                bodyRot = diveDir * 0.2;
                armExtend = 0.8;
                bodyY = -15;
            }

            ctx.rotate(bodyRot);
            ctx.translate(0, bodyY);

            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.ellipse(0, 35, 22, 8, 0, 0, Math.PI * 2); ctx.fill();

            const legAnim = Math.sin(gs.animTimer * 0.15) * (isKicker && !jumping ? 0 : 6);
            ctx.fillStyle = '#222';
            ctx.fillRect(-11, 15, 9, 22 + legAnim);
            ctx.fillRect(2, 15, 9, 22 - legAnim);

            ctx.fillStyle = color;
            ctx.beginPath(); ctx.ellipse(0, -5, 20, 26, 0, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('10', 0, -1);

            ctx.fillStyle = COLORS.skin;
            if (armExtend > 0.5) {
                ctx.fillRect(-38, -20, 10, 22);
                ctx.fillRect(28, -20, 10, 22);
                ctx.fillStyle = '#fff';
                ctx.fillRect(-42, -28, 18, 18);
                ctx.fillRect(24, -28, 18, 18);
            } else {
                ctx.fillRect(-30, -8, 9, 18);
                ctx.fillRect(21, -8, 9, 18);
            }

            ctx.fillStyle = COLORS.skin;
            ctx.beginPath(); ctx.arc(0, -40, 16, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = COLORS.hair;
            ctx.beginPath(); ctx.arc(0, -46, 14, Math.PI, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.moveTo(-6, -52); ctx.lineTo(4, -58); ctx.lineTo(10, -48); ctx.closePath(); ctx.fill();

            ctx.fillStyle = '#222';
            ctx.beginPath(); ctx.arc(-5, -43, 2.5, 0, Math.PI * 2); ctx.arc(5, -43, 2.5, 0, Math.PI * 2); ctx.fill();

            ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(-4, -34); ctx.lineTo(4, -34); ctx.stroke();

            ctx.restore();
        }

        function drawBall(x, y, z) {
            if (z === undefined) z = 0;
            const size = 14 + z * 0.3;
            ctx.fillStyle = `rgba(0,0,0,${0.35 - z * 0.015})`;
            ctx.beginPath(); ctx.ellipse(x, y + 32, size * 0.85, size * 0.35, 0, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(x, y - z, size, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#333';
            ctx.beginPath(); ctx.arc(x - size * 0.3, y - z - size * 0.3, size * 0.35, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + size * 0.4, y - z + size * 0.15, size * 0.22, 0, Math.PI * 2); ctx.fill();
        }

        function drawZones() {
            if (gs.phase !== PHASE.KICK_SELECT && gs.phase !== PHASE.KICK_POWER) return;
            zones.forEach((z, i) => {
                ctx.strokeStyle = gs.selectedZone === i ? '#fbbf24' : 'rgba(255,255,255,0.35)';
                ctx.lineWidth = gs.selectedZone === i ? 4 : 2;
                ctx.fillStyle = gs.selectedZone === i ? 'rgba(251,191,36,0.25)' : 'rgba(255,255,255,0.08)';
                ctx.beginPath(); ctx.arc(z.x, z.y, 28, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            });
            ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
            zones.forEach((z, i) => ctx.fillText(i + 1, z.x, z.y + 5));
        }

        function drawTitle() {
            ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, 900, 650);
            ctx.fillStyle = '#dc2626'; ctx.font = 'bold 68px "Russo One", sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('热血点球大战', 450, 190);
            ctx.fillStyle = '#fbbf24'; ctx.font = '26px "Russo One", sans-serif';
            ctx.fillText('HYPER PENALTY SHOOTOUT', 450, 238);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(250, 268); ctx.lineTo(650, 268); ctx.stroke();
            ctx.fillStyle = '#fff'; ctx.font = '18px sans-serif';
            ctx.fillText('方向键 选择射门区域 | 空格键 蓄力射门', 450, 320);
            ctx.fillText('← → 移动守门员 | 空格键 跳跃扑救', 450, 355);
            if (Math.sin(gs.animTimer * 0.1) > 0) {
                ctx.fillStyle = '#22c55e'; ctx.font = 'bold 26px "Russo One", sans-serif';
                ctx.fillText('PRESS SPACE TO START', 450, 450);
            }
            drawBall(450, 540 + Math.sin(gs.animTimer * 0.08) * 8, 0);
            ctx.textAlign = 'left';
        }

        function drawCoin() {
            ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, 900, 650);
            ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 34px "Russo One", sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('猜硬币决定先后', 450, 175);
            ctx.fillStyle = '#ffd700';
            ctx.beginPath(); ctx.arc(450, 290, 55, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#b8860b'; ctx.font = 'bold 44px "Russo One", sans-serif';
            ctx.fillText(gs.coinResult === '正面' ? '○' : '●', 450, 305);
            ctx.fillStyle = '#fff'; ctx.font = '22px sans-serif';
            ctx.fillText('按 1 选择先踢 | 按 2 选择先守', 450, 410); ctx.textAlign = 'left';
        }

        function drawResultPopup() {
            if (!gs.kickResult) return;
            const div = document.createElement('div');
            div.className = 'result-popup ' + (gs.kickResult === 'GOAL!' ? 'goal' : 'save');
            div.textContent = gs.kickResult;
            gameContainer.appendChild(div);
            setTimeout(() => div.remove(), 1400);
        }

        function updateUI() {
            roundNumEl.textContent = gs.round;
            playerScoreEl.textContent = gs.playerScore;
            aiScoreEl.textContent = gs.aiScore;
            modeTextEl.textContent = gs.playerIsKicker ? '【射门】' : '【扑救】';
        }

        function update() {
            gs.animTimer++;

            if (gs.shakeIntensity > 0) {
                gs.shakeIntensity *= 0.88;
                if (gs.shakeIntensity < 0.5) gs.shakeIntensity = 0;
            }

            if (gs.phase === PHASE.KICK_POWER) {
                gs.power += gs.powerDir * 2.5;
                if (gs.power >= 100) gs.power = 100, gs.powerDir = -1;
                if (gs.power <= 0) gs.power = 0, gs.powerDir = 1;
                powerFill.style.width = gs.power + '%';
            }

            if (gs.phase === PHASE.KICK_FLY) {
                gs.ball.x += gs.ball.vx;
                gs.ball.z += gs.ball.vy;
                gs.ball.vy -= 0.35;
                gs.kicker.frame += 0.25;

                if (!gs.keeper.diving && gs.keeper.jumping) {
                    gs.keeper.diveX += (gs.ballTargetX - gs.keeper.diveX) * 0.15;
                    gs.keeper.diveProgress = Math.min(1, (gs.keeper.diveProgress || 0) + 0.08);
                }

                if (gs.ball.z <= 0) {
                    gs.ball.z = 0;
                    checkKickResult();
                }
            }

            if (gs.phase === PHASE.KEEP_FLY) {
                gs.ball.x += gs.ball.vx;
                gs.ball.z += gs.ball.vy;
                gs.ball.vy -= 0.35;
                gs.kicker.frame += 0.25;

                if (!gs.keeper.diving && gs.keeper.jumping) {
                    gs.keeper.diveX += (gs.ballTargetX - gs.keeper.diveX) * 0.12;
                    gs.keeper.diveProgress = Math.min(1, (gs.keeper.diveProgress || 0) + 0.07);
                }

                if (gs.ball.z <= 0) {
                    gs.ball.z = 0;
                    checkKeepResult();
                }
            }

            if (gs.phase === PHASE.RESULT) {
                gs.resultTimer++;
                if (gs.resultTimer > 90) {
                    gs.resultTimer = 0;
                    nextPhase();
                }
            }
        }

        function checkKickResult() {
            const dist = Math.abs(gs.ball.x - gs.keeper.diveX);
            const saved = dist > 45 || Math.random() < 0.3;
            gs.kickResult = saved ? 'SAVED!' : 'GOAL!';
            if (!saved) gs.playerScore++;
            gs.shakeIntensity = saved ? 8 : 14;
            gs.phase = PHASE.RESULT;
            drawResultPopup();
        }

        function checkKeepResult() {
            const dist = Math.abs(gs.ball.x - gs.keeper.diveX);
            const saved = dist > 40 || Math.random() < 0.35;
            gs.kickResult = saved ? 'SAVED!' : 'GOAL!';
            if (!saved) gs.aiScore++;
            gs.shakeIntensity = saved ? 8 : 12;
            gs.phase = PHASE.RESULT;
            drawResultPopup();
        }

        function nextPhase() {
            if (gs.playerIsKicker) {
                gs.playerIsKicker = false;
                resetPositions();
                gs.phase = PHASE.KEEP;
                instruction.textContent = '← → 移动守门员 | 空格 跳跃';
                setTimeout(aiKick, 1100);
            } else {
                gs.round++;
                if (gs.round > 5 && gs.playerScore === gs.aiScore) { }
                else if (gs.round > 5) {
                    gs.phase = PHASE.GAMEOVER;
                    instruction.textContent = '按 空格键 重新开始';
                    return;
                }
                gs.playerIsKicker = true;
                resetPositions();
                gs.phase = PHASE.KICK_SELECT;
                instruction.textContent = '方向键选择区域 | 空格蓄力';
            }
        }

        function aiKick() {
            if (gs.phase !== PHASE.KEEP) return;
            const targetIdx = Math.floor(Math.random() * 9);
            const target = zones[targetIdx];
            gs.ball = { x: 450, y: 520, vx: (target.x - 450) / 48, vy: 7 + Math.random() * 3, z: 0 };
            gs.ballTargetX = target.x;
            gs.ballEndX = target.x;
            gs.phase = PHASE.KEEP_FLY;
            instruction.textContent = '← → 移动 | 空格 跳跃！';
        }

        function resetPositions() {
            gs.kicker.x = 450; gs.kicker.y = 520; gs.kicker.frame = 0; gs.kicker.kicking = false;
            gs.keeper.x = 450; gs.keeper.y = 140; gs.keeper.jumping = false;
            gs.keeper.diving = false; gs.keeper.diveX = 450; gs.keeper.diveDir = 0; gs.keeper.diveProgress = 0;
            gs.ball = { x: 450, y: 520, z: 0, vx: 0, vy: 0 };
            gs.power = 50; gs.selectedZone = 4;
            powerBar.style.display = 'none';
        }

        function kickBall() {
            const target = zones[gs.selectedZone];
            const power = gs.power / 100;
            gs.ball = {
                x: gs.kicker.x, y: gs.kicker.y,
                vx: (target.x - gs.kicker.x) / 42 * (0.8 + power * 0.5),
                vy: 5.5 + power * 5, z: 0
            };
            gs.ballTargetX = target.x;
            gs.ballEndX = target.x;
            gs.kicker.kicking = true;

            gs.keeper.jumping = true;
            gs.keeper.diving = true;
            gs.keeper.diveX = 450;
            gs.keeper.diveDir = target.x > 450 ? 1 : -1;
            gs.keeper.diveProgress = 0;

            gs.phase = PHASE.KICK_FLY;
            powerBar.style.display = 'none';
            instruction.textContent = '';
            gs.shakeIntensity = 8;
        }

        function render() {
            ctx.save();
            if (gs.shakeIntensity > 0) {
                ctx.translate((Math.random() - 0.5) * gs.shakeIntensity, (Math.random() - 0.5) * gs.shakeIntensity);
            }

            ctx.clearRect(0, 0, 900, 650);
            drawStadium();

            if (gs.phase === PHASE.TITLE) { drawTitle(); }
            else if (gs.phase === PHASE.COIN) {
                drawPlayer(450, 520, COLORS.blue, true, false, false, false, 0, 0);
                drawPlayer(450, 140, COLORS.red, false, true, false, false, 0, 0);
                drawCoin();
            }
            else if (gs.phase === PHASE.KICK_SELECT || gs.phase === PHASE.KICK_POWER) {
                drawZones();
                drawPlayer(gs.keeper.x, gs.keeper.y, COLORS.red, false, true, false, false, 0, 0);
                drawPlayer(gs.kicker.x, gs.kicker.y, COLORS.blue, true, false, false, false, 0, 0);
                drawBall(gs.kicker.x, gs.kicker.y, 0);
            }
            else if (gs.phase === PHASE.KICK_FLY) {
                drawZones();
                const kd = gs.keeper.diving ? gs.keeper.diveX : gs.keeper.x;
                const kp = gs.keeper.diving ? gs.keeper.diveProgress : 0;
                drawPlayer(kd, gs.keeper.y, COLORS.red, false, true, false, gs.keeper.diving, gs.keeper.diveDir, kp);
                drawPlayer(gs.kicker.x, gs.kicker.y, COLORS.blue, true, false, gs.kicker.kicking, false, 0, 0);
                drawBall(gs.ball.x, gs.ball.y, gs.ball.z);
            }
            else if (gs.phase === PHASE.KEEP) {
                drawPlayer(gs.keeper.x, gs.keeper.y, COLORS.blue, false, true, false, false, 0, 0);
                drawPlayer(gs.kicker.x, gs.kicker.y, COLORS.red, true, false, false, false, 0, 0);
                drawBall(gs.kicker.x, gs.kicker.y, 0);
            }
            else if (gs.phase === PHASE.KEEP_FLY) {
                const kd = gs.keeper.diving ? gs.keeper.diveX : gs.keeper.x;
                const kp = gs.keeper.diving ? gs.keeper.diveProgress : 0;
                drawPlayer(kd, gs.keeper.y, COLORS.blue, false, true, false, gs.keeper.diving, gs.keeper.diveDir, kp);
                drawPlayer(gs.kicker.x, gs.kicker.y, COLORS.red, true, false, false, false, 0, 0);
                drawBall(gs.ball.x, gs.ball.y, gs.ball.z);
            }
            else if (gs.phase === PHASE.RESULT) {
                drawPlayer(gs.keeper.x, gs.keeper.y, COLORS.red, false, true, false, false, 0, 0);
                drawPlayer(gs.kicker.x, gs.kicker.y, COLORS.blue, true, false, false, false, 0, 0);
                drawBall(gs.ball.x, gs.ball.y, 0);
            }
            else if (gs.phase === PHASE.GAMEOVER) {
                ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, 900, 650);
                ctx.textAlign = 'center';
                if (gs.playerScore > gs.aiScore) {
                    ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 60px "Russo One", sans-serif';
                    ctx.fillText('YOU WIN!', 450, 240);
                } else {
                    ctx.fillStyle = '#dc2626'; ctx.font = 'bold 60px "Russo One", sans-serif';
                    ctx.fillText('YOU LOSE', 450, 240);
                }
                ctx.fillStyle = '#fff'; ctx.font = '44px "Russo One", sans-serif';
                ctx.fillText(`${gs.playerScore} - ${gs.aiScore}`, 450, 320);
                ctx.font = '20px sans-serif'; ctx.fillText('按 SPACE 重新开始', 450, 400);
                ctx.textAlign = 'left';
            }

            updateUI();
            ctx.restore();
        }

        document.addEventListener('keydown', e => {
            if (e.code === 'Space') e.preventDefault();
            if (gs.phase === PHASE.TITLE) {
                if (e.code === 'Space') { gs.phase = PHASE.COIN; gs.coinResult = Math.random() > 0.5 ? '正面' : '背面'; }
            } else if (gs.phase === PHASE.COIN) {
                if (e.code === 'Digit1' || e.code === 'Numpad1') {
                    gs.playerIsKicker = true; gs.phase = PHASE.KICK_SELECT; resetPositions();
                    instruction.textContent = '方向键选择区域 | 空格蓄力';
                } else if (e.code === 'Digit2' || e.code === 'Numpad2') {
                    gs.playerIsKicker = false; gs.phase = PHASE.KEEP; resetPositions();
                    instruction.textContent = '← → 移动守门员 | 空格 跳跃';
                    setTimeout(aiKick, 1100);
                }
            } else if (gs.phase === PHASE.KICK_SELECT) {
                if (e.code === 'ArrowLeft' && gs.selectedZone > 0) gs.selectedZone--;
                else if (e.code === 'ArrowRight' && gs.selectedZone < 8) gs.selectedZone++;
                else if (e.code === 'Space') { gs.phase = PHASE.KICK_POWER; powerBar.style.display = 'block'; }
            } else if (gs.phase === PHASE.KICK_POWER) {
                if (e.code === 'Space') kickBall();
            } else if (gs.phase === PHASE.KEEP) {
                if (e.code === 'ArrowLeft') gs.keeper.x = Math.max(270, gs.keeper.x - 12);
                else if (e.code === 'ArrowRight') gs.keeper.x = Math.min(630, gs.keeper.x + 12);
                else if (e.code === 'Space' && !gs.keeper.jumping) {
                    gs.keeper.jumping = true; gs.keeper.diving = true;
                    gs.keeper.diveX = gs.keeper.x; gs.keeper.diveDir = 0; gs.keeper.diveProgress = 0;
                }
            } else if (gs.phase === PHASE.GAMEOVER) {
                if (e.code === 'Space') {
                    gs.phase = PHASE.TITLE; gs.playerScore = 0; gs.aiScore = 0; gs.round = 1;
                    resetPositions(); instruction.textContent = '';
                }
            }
        });

        function gameLoop() { update(); render(); requestAnimationFrame(gameLoop); }
        gameLoop();
    </script>
</body>
</html>
